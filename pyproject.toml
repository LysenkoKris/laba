[tool.isort]
profile = "black"
known_first_party = ["app"]
skip = []

[tool.black]
line-length = 88
target-version = ["py313"]
# Используем extend-exclude с обычной строкой, чтобы не ломать парсер
extend-exclude = '''
^/(\.git|\.hg|\.mypy_cache|\.tox|\.venv|_build|build|dist|docker|temp)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::pytest.PytestRemovedIn9Warning"
]